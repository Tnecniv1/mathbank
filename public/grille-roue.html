// ─── Géométrie ─────────────────────────────────────────────────────
const W = 640, H = 640, CX = 320, CY = 320;
const R_IN = 58, R_OUT = 230, R_LABEL = 256;

const SECTORS = [
  { key:"C", label:"Compréhension", color:"#3D7FD4", startAngle:-90 },
  { key:"S", label:"Savoir",        color:"#D4503D", startAngle:30  },
  { key:"R", label:"Rédaction",     color:"#3DAF6B", startAngle:150 },
];

const WEDGES = [];
SECTORS.forEach(s => {
  for(let i=0;i<4;i++){
    const a1=s.startAngle+i*30;
    WEDGES.push({id:`${s.key}${i+1}`,sectorKey:s.key,color:s.color,a1,a2:a1+30});
  }
});

function rad(d){ return d*Math.PI/180; }
function pt(a,r){ return [CX+r*Math.cos(rad(a)), CY+r*Math.sin(rad(a))]; }
function wedgePath(a1,a2,r1,r2){
  const [x1,y1]=pt(a1,r1),[x2,y2]=pt(a1,r2),[x3,y3]=pt(a2,r2),[x4,y4]=pt(a2,r1);
  return `M${x1},${y1}L${x2},${y2}A${r2},${r2} 0 0,1 ${x3},${y3}L${x4},${y4}A${r1},${r1} 0 0,0 ${x1},${y1}Z`;
}

// ─── Nouveau format ────────────────────────────────────────────────
function newSheet(id){
  return {id, createdAt:Date.now(), meta:{prenom:"",nom:"",feuille:"",note:"",sessions:[],user_id:null}, exercices:[], closed:false, inserted:false};
}

// Rétrocompat : ancien format (crosses/validated/mecanique) → nouveau (exercices[])
function migrateSheet(sheet){
  if(sheet.exercices) return sheet;
  const exercices = [];
  exercices.push({
    id: sheet.id+'_c0',
    type: 'chaotique',
    reference: sheet.meta&&sheet.meta.exo ? sheet.meta.exo : '',
    crosses: sheet.crosses || {},
    validated: sheet.validated || {},
    reussi: null,
  });
  if((sheet.mecanique||[]).length > 0){
    exercices.push({
      id: sheet.id+'_m0',
      type: 'mecanique',
      reference: '',
      observations: (sheet.mecanique||[]).map(m=>({reference:m.reference||'', reussi:m.reussi!=null?m.reussi:null})),
      reussi: null,
    });
  }
  return {...sheet, exercices};
}

// ─── Storage localStorage ──────────────────────────────────────────
const store = {
  get(key){ try{ const v=localStorage.getItem(key); return v?JSON.parse(v):null; }catch{return null;} },
  set(key,val){ try{ localStorage.setItem(key,JSON.stringify(val)); }catch{} },
};

// ─── DB Supabase ───────────────────────────────────────────────────
let currentUserId  = null;
let isOnline       = navigator.onLine;
let _setSaveStatus = () => {};
let _currentSheets = [];
const DEBOUNCE_MS  = 2000;
let saveTimer      = null;

const db = {
  async loadAll() {
    if (!isOnline) return (store.get('grille-sheets')||[]).map(migrateSheet);
    try {
      const { data, error } = await sb
        .from('grille_observation')
        .select('id, data, closed, inserted, updated_at')
        .order('updated_at', { ascending: false });
      if (error) throw error;
      return (data||[]).map(row => migrateSheet({ ...row.data, id: row.id, closed: !!row.closed, inserted: !!row.inserted }));
    } catch {
      isOnline = false;
      _setSaveStatus('offline');
      return (store.get('grille-sheets')||[]).map(migrateSheet);
    }
  },
  scheduleSave(sheet) {
    clearTimeout(saveTimer);
    _setSaveStatus('saving');
    if (sheet.closed) { db.saveNow(sheet); return; }
    saveTimer = setTimeout(() => db.saveNow(sheet), DEBOUNCE_MS);
  },
  async saveNow(sheet) {
    const local = store.get('grille-sheets') || [];
    const idx = local.findIndex(s => s.id === sheet.id);
    if (idx >= 0) local[idx] = sheet; else local.unshift(sheet);
    store.set('grille-sheets', local);
    if (!isOnline || !currentUserId) { _setSaveStatus('offline'); return; }
    try {
      const { error } = await sb.from('grille_observation').upsert({
        id: sheet.id, user_id: currentUserId,
        data: sheet, closed: sheet.closed ?? false, inserted: sheet.inserted ?? false,
        updated_at: new Date().toISOString(),
      });
      if (error) throw error;
      _setSaveStatus('saved');
      setTimeout(() => _setSaveStatus(s => s === 'saved' ? null : s), 3000);
    } catch { _setSaveStatus('offline'); }
  },
  async delete(id) {
    const local = store.get('grille-sheets') || [];
    store.set('grille-sheets', local.filter(s => s.id !== id));
    if (!isOnline || !currentUserId) return;
    try { await sb.from('grille_observation').delete().eq('id', id); } catch {}
  },
  async syncOnline() {
    for (const sheet of _currentSheets) await db.saveNow(sheet);
  },
};
window.addEventListener('online',  () => { isOnline = true; db.syncOnline(); });
window.addEventListener('offline', () => { isOnline = false; _setSaveStatus('offline'); });

// ─── Export / Import ───────────────────────────────────────────────
function exportSheet(sheet){
  const name = (sheet.meta.feuille||'').replace(/\s+/g,"-") || `grille-${sheet.id}`;
  const payload = {version:"2.0", type:"grille-competences", exportedAt:new Date().toISOString(), ...sheet};
  const blob = new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement("a");
  a.href=url; a.download=`${name}.json`; a.click();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}

function importSheet(file, onOk, onErr){
  const r=new FileReader();
  r.onload=e=>{
    try{
      const d=JSON.parse(e.target.result);
      if(d.type!=="grille-competences") throw new Error();
      onOk(migrateSheet({...d, id:Date.now().toString()}));
    }catch{ onErr("Fichier invalide ou non reconnu."); }
  };
  r.readAsText(file);
}

// ─── Croix SVG ────────────────────────────────────────────────────
function Cross({x,y,color,onRemove}){
  const s=7;
  return React.createElement("g",{onClick:onRemove,style:{cursor:"pointer"}},
    React.createElement("circle",{cx:x,cy:y,r:s+7,fill:"transparent"}),
    React.createElement("line",{x1:x-s,y1:y-s,x2:x+s,y2:y+s,stroke:color,strokeWidth:"2.6",strokeLinecap:"round"}),
    React.createElement("line",{x1:x+s,y1:y-s,x2:x-s,y2:y+s,stroke:color,strokeWidth:"2.6",strokeLinecap:"round"}),
  );
}

// ─── Insert dans Mathbank (logique RPC partagée) ──────────────────
async function doInsertInMathbank(sheet) {
  const sessions = sheet.meta.sessions || [];
  for (let i = 0; i < sessions.length - 1; i++) {
    const s = sessions[i];
    await sb.rpc('insert_session_chef', {
      p_membre_user_id:       sheet.meta.user_id,
      p_date:                 s.date,
      p_duree:                parseInt(s.duree) || 0,
      p_feuille_mecanique_id: null,
      p_feuille_chaotique_id: null,
    });
  }
  const last     = sessions[sessions.length - 1];
  const exoMeca  = (sheet.exercices || []).find(e => e.type === 'mecanique');
  const exoChaos = (sheet.exercices || []).find(e => e.type === 'chaotique');
  const { data: sessionId } = await sb.rpc('insert_session_chef', {
    p_membre_user_id:       sheet.meta.user_id,
    p_date:                 last.date,
    p_duree:                parseInt(last.duree) || 0,
    p_feuille_mecanique_id: exoMeca?.feuille_id  || null,
    p_feuille_chaotique_id: exoChaos?.feuille_id || null,
  });
  if (sessionId) {
    let ordreCount = 1;
    for (const exo of (sheet.exercices || []).filter(e => e.type === 'mecanique')) {
      for (const obs of (exo.observations || [])) {
        const { data: exoId } = await sb.rpc('insert_exercice_chef', {
          p_session_id: sessionId, p_type: 'mecanique',
          p_reference: obs.reference || '', p_ordre: ordreCount++,
        });
        if (exoId) {
          await sb.rpc('insert_score_exercice_chef', {
            p_exercice_id: exoId, p_reussi: !!obs.reussi,
            p_c1:false, p_c2:false, p_c3:false, p_c4:false,
            p_s1:false, p_s2:false, p_s3:false, p_s4:false,
            p_r1:false, p_r2:false, p_r3:false, p_r4:false, p_correction:false,
          });
        }
      }
    }
    for (const exo of (sheet.exercices || []).filter(e => e.type === 'chaotique')) {
      if (!exo.validated || Object.keys(exo.validated).length === 0) continue;
      const { data: exoId } = await sb.rpc('insert_exercice_chef', {
        p_session_id: sessionId, p_type: 'chaotique',
        p_reference: exo.reference || '', p_ordre: ordreCount++,
      });
      if (exoId) {
        const v = exo.validated || {};
        await sb.rpc('insert_score_exercice_chef', {
          p_exercice_id: exoId, p_reussi: false,
          p_c1:!!v.C1, p_c2:!!v.C2, p_c3:!!v.C3, p_c4:!!v.C4,
          p_s1:!!v.S1, p_s2:!!v.S2, p_s3:!!v.S3, p_s4:!!v.S4,
          p_r1:!!v.R1, p_r2:!!v.R2, p_r3:!!v.R3, p_r4:!!v.R4, p_correction:false,
        });
      }
    }
  }
}

// ─── Éditeur de roue ──────────────────────────────────────────────
function WheelEditor({sheet, onChange}){
  const svgRef = useRef(null);
  const [editMeta, setEditMeta] = useState(false);
  const [localMeta, setLocalMeta] = useState(sheet.meta);
  const [membres, setMembres] = useState([]);
  const [feuillesAutorisees, setFeuillesAutorisees] = useState([]);
  const [undoStack, setUndoStack] = useState([]);
  const [inserting, setInserting] = useState(false);

  async function insertInMathbank() {
    if (!sheet.meta.user_id) { alert('Veuillez associer un étudiant à cette grille'); return; }
    if ((sheet.meta.sessions || []).length === 0) { alert('Aucune session enregistrée'); return; }
    setInserting(true);
    try {
      await doInsertInMathbank(sheet);
      onChange(p => ({...p, inserted:true, insertedAt:Date.now()}));
      alert('Insertion réussie !');
    } catch(err) {
      alert('Erreur lors de l\'insertion : ' + (err?.message || err));
    } finally {
      setInserting(false);
    }
  }

  useEffect(() => {
    sb.from('profiles').select('user_id,full_name').then(({data, error}) => {
      console.log('[grille] profiles:', data, error);
      if(data && data.length > 0) {
        setMembres(data.map(r => ({user_id:r.user_id, prenom:r.full_name||r.user_id.slice(0,8), nom:''})));
      } else {
        sb.from('membre_equipe').select('user_id').then(({data: d2}) => {
          if(d2) setMembres(d2.map(r => ({user_id:r.user_id, prenom:r.user_id.slice(0,8), nom:''})));
        });
      }
    });
  }, []);

  useEffect(() => {
    if(!sheet.meta.user_id) { setFeuillesAutorisees([]); return; }
    // 1. Trouver le membre_equipe.id depuis user_id
    sb.from('membre_equipe').select('id')
      .eq('user_id', sheet.meta.user_id)
      .then(({data: membres}) => {
        if(!membres || membres.length === 0) return;
        const membreIds = membres.map(m => m.id);
        // 2. Charger les feuilles autorisées via membre_id
        sb.from('feuilles_autorisees')
          .select('feuille_id, feuille_entrainement(id,titre,type)')
          .in('membre_id', membreIds)
          .then(({data}) => {
            if(data) setFeuillesAutorisees(data.map(r=>r.feuille_entrainement).filter(Boolean));
          });
      });
  }, [sheet.meta.user_id]);

  const exercices = sheet.exercices || [];
  const [activeExoId, setActiveExoId] = useState(exercices.length > 0 ? exercices[0].id : null);

  useEffect(() => { setUndoStack([]); }, [activeExoId]);
  const activeExo = exercices.find(e => e.id === activeExoId) || null;

  const updateActiveExo = useCallback((fn) => {
    onChange(p => ({
      ...p,
      exercices: (p.exercices||[]).map(e => e.id === activeExoId ? fn(e) : e),
    }));
  }, [onChange, activeExoId]);

  const addChaotiqueExo = () => {
    if(sheet.closed) return;
    const id = Date.now().toString();
    onChange(p => ({...p, exercices:[...(p.exercices||[]), {id,type:'chaotique',feuille_id:null,reference:'',crosses:{},validated:{},reussi:null}]}));
    setActiveExoId(id);
  };

  const addMecaniqueExo = () => {
    if(sheet.closed) return;
    const id = Date.now().toString();
    onChange(p => ({...p, exercices:[...(p.exercices||[]), {id,type:'mecanique',feuille_id:null,reference:'',observations:[],reussi:null}]}));
    setActiveExoId(id);
  };

  const removeExo = (exoId) => {
    if(sheet.closed) return;
    const remaining = exercices.filter(e => e.id !== exoId);
    onChange(p => ({...p, exercices:(p.exercices||[]).filter(e => e.id !== exoId)}));
    if(activeExoId === exoId) setActiveExoId(remaining.length > 0 ? remaining[0].id : null);
  };

  const toggleValidated = useCallback((wedgeId, evt) => {
    evt.stopPropagation();
    if(sheet.closed) return;
    updateActiveExo(e => { const v={...(e.validated||{})}; v[wedgeId]=!v[wedgeId]; return {...e,validated:v}; });
  }, [updateActiveExo, sheet.closed]);

  const handleClick = useCallback(evt => {
    if(!activeExo || activeExo.type !== 'chaotique' || sheet.closed) return;
    const svg = svgRef.current;
    const rect = svg.getBoundingClientRect();
    const mx = (evt.clientX-rect.left)*(W/rect.width);
    const my = (evt.clientY-rect.top)*(H/rect.height);
    const dx = mx-CX, dy = my-CY;
    const r = Math.sqrt(dx*dx+dy*dy);
    if(r<R_IN||r>R_OUT) return;
    const deg = (Math.atan2(dy,dx)*180)/Math.PI;
    const norm = x => ((x%360)+360)%360;
    const wedge = WEDGES.find(w=>{ const na=norm(deg-w.a1),sp=norm(w.a2-w.a1); return na>=0&&na<sp; });
    if(!wedge) return;
    updateActiveExo(e => { const c={...e.crosses}; c[wedge.id]=[...(c[wedge.id]||[]),{x:mx,y:my}]; return {...e,crosses:c}; });
    setUndoStack(s => [...s, wedge.id]);
  }, [activeExo, sheet.closed, updateActiveExo]);

  const handleTouch = useCallback(evt => {
    evt.preventDefault();
    const t = evt.changedTouches[0];
    handleClick({clientX:t.clientX, clientY:t.clientY});
  }, [handleClick]);

  const removeCross = (wid, idx) => {
    if(sheet.closed) return;
    updateActiveExo(e => { const arr=[...(e.crosses[wid]||[])]; arr.splice(idx,1); return {...e,crosses:{...e.crosses,[wid]:arr}}; });
  };

  const undoCross = () => {
    if(undoStack.length === 0 || sheet.closed) return;
    const wid = undoStack[undoStack.length - 1];
    setUndoStack(s => s.slice(0, -1));
    updateActiveExo(e => { const arr=[...(e.crosses[wid]||[])]; arr.splice(arr.length-1,1); return {...e,crosses:{...e.crosses,[wid]:arr}}; });
  };

  const saveMeta = () => { if(sheet.closed) return; onChange(p=>({...p,meta:localMeta})); setEditMeta(false); };

  const addObs    = () => { if(sheet.closed) return; updateActiveExo(e => ({...e, observations:[...(e.observations||[]),{reference:'',reussi:null}]})); };
  const updateObs = (idx,patch) => { if(sheet.closed) return; updateActiveExo(e => { const o=[...(e.observations||[])]; o[idx]={...o[idx],...patch}; return {...e,observations:o}; }); };
  const removeObs = (idx) => { if(sheet.closed) return; updateActiveExo(e => { const o=[...(e.observations||[])]; o.splice(idx,1); return {...e,observations:o}; }); };

  const crosses   = activeExo&&activeExo.crosses   ? activeExo.crosses   : {};
  const validated = activeExo&&activeExo.validated ? activeExo.validated : {};
  const counts    = SECTORS.map(s=>({...s, total:WEDGES.filter(w=>w.sectorKey===s.key).reduce((a,w)=>a+(crosses[w.id]&&crosses[w.id].length||0),0)}));

  const svgProps = {
    ref:svgRef, viewBox:`0 0 ${W} ${H}`, width:"100%",
    onClick:handleClick, onTouchEnd:handleTouch,
    style:{display:"block", cursor:activeExo&&activeExo.type==='chaotique'?"crosshair":"default", touchAction:"none"},
  };

  return React.createElement("div",{style:{display:"flex",flexDirection:"column",alignItems:"center",gap:12}},

    // ── Barre méta ──
    React.createElement("div",{style:{width:"100%",maxWidth:520,display:"flex",alignItems:"center",gap:10,marginBottom:4}},
      React.createElement("div",{
        onClick:()=>{ if(!sheet.closed){ setEditMeta(true); setLocalMeta(sheet.meta); } },
        style:{flex:1,background:"white",borderRadius:10,border:"1px solid #E0D5C5",padding:"8px 12px",cursor:"pointer",minWidth:0},
      },
        React.createElement("div",{style:{fontSize:12,fontWeight:"600",color:"#2C1810",fontFamily:"Georgia,serif",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}},[sheet.meta.prenom,sheet.meta.nom].filter(Boolean).join(" ")||"—"),
        React.createElement("div",{style:{fontSize:10,color:"#8B7355",fontFamily:"Georgia,serif",marginTop:1,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}},sheet.meta.feuille||"Feuille —"),
        React.createElement("div",{style:{fontSize:9,color:"#B0A090",fontFamily:"Georgia,serif",marginTop:1}},(sheet.meta.sessions||[]).length>0?`${(sheet.meta.sessions||[]).length} session${(sheet.meta.sessions||[]).length>1?"s":""}`:"Aucune session"),
      ),
      React.createElement("div",{style:{fontSize:14,color:"#C8BBA8",flexShrink:0}},"✎"),
    ),

    // ── Liste des exercices ──
    React.createElement("div",{style:{width:"100%",maxWidth:520,display:"flex",flexDirection:"column",gap:8}},
      exercices.length > 0 && React.createElement("div",{style:{display:"flex",flexWrap:"wrap",gap:6}},
        ...exercices.map(exo => {
          const sel = activeExoId === exo.id;
          return React.createElement("div",{
            key:exo.id,
            onClick:()=>setActiveExoId(exo.id),
            style:{display:"flex",alignItems:"center",gap:6,padding:"6px 10px",background:sel?"#2C1810":"white",border:`1.5px solid ${sel?"#2C1810":"#D0C5B5"}`,borderRadius:8,cursor:"pointer"},
          },
            React.createElement("span",{style:{fontSize:11,fontFamily:"Georgia,serif",color:sel?"#FDFAF6":"#2C1810",maxWidth:100,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}},
              exo.reference||(exo.type==='chaotique'?'Roue':'Tableau')
            ),
            React.createElement("span",{style:{fontSize:9,fontWeight:"bold",padding:"2px 5px",borderRadius:4,background:exo.type==='chaotique'?"#3D7FD4":"#7B5A3D",color:"white"}},
              exo.type==='chaotique'?"C":"M"
            ),
            !sheet.closed && React.createElement("button",{
              onClick:e=>{ e.stopPropagation(); removeExo(exo.id); },
              style:{background:"transparent",border:"none",cursor:"pointer",color:sel?"#FDFAF6":"#C8BBA8",fontSize:12,padding:"0 2px",lineHeight:1},
            },"✕"),
          );
        }),
      ),
      exercices.length === 0 && React.createElement("div",{style:{textAlign:"center",padding:"20px",color:"#B0A090",fontStyle:"italic",fontSize:12,background:"white",borderRadius:10,border:"1px solid #E8E0D4"}},"Aucun exercice. Ajoutez une roue ou un tableau."),
      !sheet.closed && React.createElement("div",{style:{display:"flex",gap:8}},
        React.createElement("button",{onClick:addChaotiqueExo,style:{padding:"8px 14px",fontSize:12,background:"transparent",border:"1.5px dashed #3D7FD4",borderRadius:8,color:"#3D7FD4",cursor:"pointer",fontFamily:"Georgia,serif"}},"+ Roue (C)"),
        React.createElement("button",{onClick:addMecaniqueExo,style:{padding:"8px 14px",fontSize:12,background:"transparent",border:"1.5px dashed #7B5A3D",borderRadius:8,color:"#7B5A3D",cursor:"pointer",fontFamily:"Georgia,serif"}},"+ Tableau (M)"),
      ),
    ),

    // ── Éditeur exercice actif ──
    activeExo && React.createElement("div",{style:{width:"100%",maxWidth:520,display:"flex",flexDirection:"column",gap:12}},

      // Sélecteur feuille + N° exercice
      React.createElement("div",{style:{display:"flex",flexDirection:"column",gap:8}},

        ...WEDGES.flatMap(w=>chaotiques.flatMap(exo=>(exo.crosses&&exo.crosses[w.id]?exo.crosses[w.id]:[]).map((c,idx)=>React.createElement("g",{key:`${exo.id}-${w.id}-${idx}`},
          React.createElement("line",{x1:c.x-10,y1:c.y-10,x2:c.x+10,y2:c.y+10,stroke:w.color,strokeWidth:"5",strokeLinecap:"round"}),
          React.createElement("line",{x1:c.x+10,y1:c.y-10,x2:c.x-10,y2:c.y+10,stroke:w.color,strokeWidth:"5",strokeLinecap:"round"}),
        )))),
        React.createElement("circle",{cx:CX,cy:CY,r:R_IN,fill:"#FDFAF6",stroke:"#C8BBA8",strokeWidth:"3"}),
      ),
    ),
    React.createElement("div",{onClick:onOpen,style:{flex:1,minWidth:0,cursor:"pointer"}},
      React.createElement("div",{style:{fontSize:13,fontWeight:"600",color:"#2C1810",marginBottom:3,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}},label),
      React.createElement("div",{style:{display:"flex",gap:8,alignItems:"center",flexWrap:"wrap"}},
        ...counts.map(s=>React.createElement("span",{key:s.key,style:{fontSize:11,color:s.color}},`${s.key}:${s.total}`)),
        chaotiques.length>0 && React.createElement("span",{style:{fontSize:10,color:"#3D7FD4",background:"#EEF4FC",borderRadius:4,padding:"1px 5px"}},`${chaotiques.length}C`),
        mecaniques.length>0 && React.createElement("span",{style:{fontSize:10,color:"#7B5A3D",background:"#F5EDE6",borderRadius:4,padding:"1px 5px"}},`${mecaniques.length}M`),
      ),
      React.createElement("div",{style:{display:"flex",alignItems:"center",gap:5,marginTop:3}},
        sheet.closed && React.createElement("span",{style:{fontSize:9,background:"#3DAF6B",color:"white",borderRadius:4,padding:"1px 6px",fontFamily:"Georgia,serif",letterSpacing:"0.03em"}},"bouclée"),
        sheet.inserted && React.createElement("span",{style:{fontSize:9,background:"#3D7FD4",color:"white",borderRadius:4,padding:"1px 6px",fontFamily:"Georgia,serif",letterSpacing:"0.03em"}},"inséré"),
        React.createElement("span",{style:{fontSize:10,color:"#B0A090"}},`${(sheet.meta.sessions||[]).length>0?(sheet.meta.sessions||[]).length+"×":date} · ${crossTotal} croix`),
      ),
      sheet.meta.note && React.createElement("div",{style:{fontSize:10,color:"#8B7355",marginTop:2,fontStyle:"italic",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}},`"${sheet.meta.note}"`),
    ),
    React.createElement("div",{style:{display:"flex",flexDirection:"column",gap:6,flexShrink:0}},
      React.createElement("button",{onClick:onExport,title:"Exporter",style:{background:"transparent",border:"1px solid #D0C5B5",color:"#5A4A3A",cursor:"pointer",fontSize:13,padding:"4px 9px",borderRadius:6}},"↓"),
      canInsert && React.createElement("button",{
        onClick:inserting ? undefined : handleInsert,
        disabled:inserting,
        title:inserting ? "Insertion…" : "Insérer dans mathbank",
        style:{background:inserting?"#6FA8E0":"#3D7FD4",border:"none",color:"#FDFAF6",cursor:inserting?"default":"pointer",fontSize:13,padding:"4px 9px",borderRadius:6},
      },inserting ? "⏳" : "📥"),
      React.createElement("button",{onClick:onDelete,title:"Supprimer",style:{background:"transparent",border:"none",color:"#C8BBA8",cursor:"pointer",fontSize:14,padding:"4px 6px",borderRadius:6}},"✕"),
    ),
  );
}

// ─── Écran de connexion ───────────────────────────────────────────
function LoginScreen({ onLogin }) {
  const [email, setEmail] = useState('');
  const [password, setPassword] = useState('');
  const [error, setError] = useState(null);
  const [loading, setLoading] = useState(false);
  const login = async () => {
    if (!email || !password) return;
    setLoading(true); setError(null);
    const { data, error } = await sb.auth.signInWithPassword({ email, password });
    setLoading(false);
    if (error) { setError(error.message); return; }
    onLogin(data.user);
  };
  const inp = { width:"100%",padding:"10px 12px",border:"1px solid #D0C5B5",borderRadius:8,fontSize:14,color:"#2C1810",background:"#FDFAF6",outline:"none",fontFamily:"Georgia,serif" };
  return React.createElement("div",{style:{minHeight:"100vh",background:"#F5F0E8",display:"flex",alignItems:"center",justifyContent:"center",padding:20}},
    React.createElement("div",{style:{background:"white",borderRadius:16,padding:"32px 28px",width:"100%",maxWidth:340,boxShadow:"0 8px 40px rgba(0,0,0,0.1)",border:"1px solid #E0D5C5"}},
      React.createElement("div",{style:{fontSize:22,fontWeight:"bold",color:"#2C1810",marginBottom:4,fontFamily:"Georgia,serif"}},"Roue des compétences"),
      React.createElement("div",{style:{fontSize:12,color:"#8B7355",marginBottom:24,fontStyle:"italic"}},"Connectez-vous pour accéder à vos feuilles"),
      error && React.createElement("div",{style:{background:"#FFF0EE",border:"1px solid #F0C0BB",color:"#C06060",padding:"10px 12px",borderRadius:8,fontSize:13,marginBottom:16}},error),
      React.createElement("div",{style:{marginBottom:14}},
        React.createElement("label",{style:{fontSize:10,color:"#8B7355",display:"block",marginBottom:4,letterSpacing:"0.1em",textTransform:"uppercase"}},"Email"),
        React.createElement("input",{type:"email",value:email,onChange:e=>setEmail(e.target.value),onKeyDown:e=>e.key==='Enter'&&login(),style:inp}),
      ),
      React.createElement("div",{style:{marginBottom:24}},
        React.createElement("label",{style:{fontSize:10,color:"#8B7355",display:"block",marginBottom:4,letterSpacing:"0.1em",textTransform:"uppercase"}},"Mot de passe"),
        React.createElement("input",{type:"password",value:password,onChange:e=>setPassword(e.target.value),onKeyDown:e=>e.key==='Enter'&&login(),style:inp}),
      ),
      React.createElement("button",{onClick:login,disabled:loading,
        style:{width:"100%",padding:12,background:loading?"#8B7355":"#2C1810",color:"#FDFAF6",border:"none",borderRadius:10,fontSize:14,cursor:loading?"not-allowed":"pointer",fontFamily:"Georgia,serif"}
      }, loading?"Connexion…":"Se connecter"),
    ),
  );
}

// ─── App ──────────────────────────────────────────────────────────
function App(){
  const [sheets,      setSheets]      = useState([]);
  const [activeId,    setActiveId]    = useState(null);
  const [error,       setError]       = useState(null);
  const [user,        setUser]        = useState(null);
  const [authLoading, setAuthLoading] = useState(true);
  const [saveStatus,  setSaveStatus]  = useState(null);
  const [filter,      setFilter]      = useState('en_cours');
  const importRef = useRef(null);

  useEffect(() => { _setSaveStatus = setSaveStatus; }, []);
  useEffect(() => { _currentSheets = sheets; }, [sheets]);

  useEffect(() => {
    sb.auth.getSession().then(({ data: { session } }) => {
      if (session&&session.user) { currentUserId = session.user.id; setUser(session.user); }
      setAuthLoading(false);
    });
  }, []);

  useEffect(() => {
    if (!user) return;
    db.loadAll().then(loaded => setSheets(loaded));
  }, [user]);

  // Charge _membres et _feuilles dès que l'utilisateur est connecté
  useEffect(() => {
    if (!user) return;
    // _membres
    sb.from('profiles').select('user_id,full_name').then(({data}) => {
      if (data && data.length > 0) {
        _membres = data.map(r => ({user_id:r.user_id, full_name:r.full_name||r.user_id.slice(0,8)}));
      } else {
        sb.from('membre_equipe').select('user_id').then(({data:d2}) => {
          if (d2) _membres = d2.map(r => ({user_id:r.user_id, full_name:r.user_id.slice(0,8)}));
        });
      }
    });
    // _feuilles : toutes les feuilles autorisées de l'équipe
    sb.from('membre_equipe').select('id').then(({data:membres}) => {
      if (!membres || membres.length === 0) return;
      sb.from('feuilles_autorisees')
        .select('feuille_id, feuille_entrainement(id,titre)')
        .in('membre_id', membres.map(m => m.id))
        .then(({data}) => {
          if (data) data.forEach(r => { if (r.feuille_entrainement) _feuilles[r.feuille_entrainement.id] = r.feuille_entrainement.titre; });
        });
    });
  }, [user]);

  const create = () => {
    const s = newSheet(Date.now().toString());
    setSheets(p => [s, ...p]); setActiveId(s.id); db.saveNow(s);
  };

  const update = (id, fn) => setSheets(p => p.map(s => {
    if (s.id !== id) return s;
    const updated = fn(s); db.scheduleSave(updated); return updated;
  }));

  const remove = (id) => {
    setSheets(p => p.filter(s => s.id !== id));
    if (activeId === id) setActiveId(null);
    db.delete(id);
  };

  const insertSheet = async (sheet) => {
    try {
      await doInsertInMathbank(sheet);
      update(sheet.id, p => ({...p, inserted:true, insertedAt:Date.now()}));
      alert('Insertion réussie !');
    } catch(err) {
      alert('Erreur lors de l\'insertion : ' + (err?.message || err));
    }
  };

  const handleImport = e => {
    const file = e.target.files&&e.target.files[0]; if (!file) return;
    importSheet(file, s => {
      setSheets(p => [s, ...p]); setActiveId(s.id); setError(null); db.saveNow(s);
    }, msg => setError(msg));
    e.target.value = "";
  };

  const logout = async () => {
    await sb.auth.signOut();
    currentUserId = null; setUser(null); setSheets([]); setActiveId(null);
  };

  if (authLoading) return React.createElement("div",{style:{minHeight:"100vh",background:"#F5F0E8",display:"flex",alignItems:"center",justifyContent:"center",fontSize:14,color:"#8B7355",fontStyle:"italic",fontFamily:"Georgia,serif"}},"Chargement…");
  if (!user) return React.createElement(LoginScreen,{onLogin:(u)=>{ currentUserId=u.id; setUser(u); }});

  const active = sheets.find(s=>s.id===activeId);
  const lastSessionDate = s => s.meta?.sessions?.length
    ? (s.meta.sessions[s.meta.sessions.length - 1]?.date ?? "0000-00-00")
    : "0000-00-00";
  const sortByLastSession = arr => [...arr].sort((a,b) => lastSessionDate(a).localeCompare(lastSessionDate(b)));
  const filteredSheets = filter==='en_cours' ? sortByLastSession(sheets.filter(s=>!s.closed))
                       : filter==='boucle'   ? sortByLastSession(sheets.filter(s=>s.closed&&!s.inserted))
                       :                       sortByLastSession(sheets.filter(s=>s.closed&&!!s.inserted));

  const saveIndicator =
    saveStatus === 'saving'  ? React.createElement("span",{style:{fontSize:11,color:"#8B7355",fontStyle:"italic"}},"Sauvegarde…") :
    saveStatus === 'saved'   ? React.createElement("span",{style:{fontSize:11,color:"#3DAF6B"}},"✓ Sauvegardé") :
    saveStatus === 'offline' ? React.createElement("span",{style:{fontSize:11,color:"#C06060"}},"⚠ Hors ligne") :
    null;

  const topBar = React.createElement("div",{style:{position:"sticky",top:0,zIndex:50,background:"#FDFAF6",borderBottom:"1px solid #E0D5C5",padding:"14px 20px",display:"flex",alignItems:"center",gap:12,boxShadow:"0 1px 6px rgba(0,0,0,0.05)"}},
    active && React.createElement("button",{onClick:()=>setActiveId(null),style:{background:"transparent",border:"1px solid #D0C5B5",borderRadius:8,color:"#5A4A3A",cursor:"pointer",padding:"6px 12px",fontSize:12}},"← Retour"),
    React.createElement("div",{style:{flex:1}},
      React.createElement("div",{style:{fontSize:10,letterSpacing:"0.12em",color:"#8B7355",textTransform:"uppercase"}},active?(active.meta.feuille||"Sans titre"):"Mes feuilles"),
      React.createElement("div",{style:{fontSize:17,fontWeight:"bold",color:"#2C1810",marginTop:1}},"Roue des compétences"),
    ),
    saveIndicator,
    !active && React.createElement("div",{style:{display:"flex",gap:8}},
      React.createElement("input",{ref:importRef,type:"file",accept:".json",onChange:handleImport,style:{display:"none"}}),
      React.createElement("button",{onClick:()=>importRef.current&&importRef.current.click(),style:{background:"transparent",border:"1px solid #C0B5A5",color:"#5A4A3A",borderRadius:10,padding:"10px 14px",fontSize:13,cursor:"pointer"}},"↑ Importer"),
      React.createElement("button",{onClick:create,style:{background:"#2C1810",color:"#FDFAF6",border:"none",borderRadius:10,padding:"10px 18px",fontSize:13,cursor:"pointer"}},"+ Nouvelle feuille"),
    ),
    active && React.createElement("button",{onClick:()=>remove(active.id),style:{background:"transparent",border:"1px solid #E0C0BC",borderRadius:8,color:"#C06060",cursor:"pointer",padding:"6px 12px",fontSize:12}},"Supprimer"),
    React.createElement("button",{onClick:logout,title:"Se déconnecter",style:{background:"transparent",border:"1px solid #D0C5B5",borderRadius:8,color:"#B0A090",cursor:"pointer",padding:"6px 10px",fontSize:11,whiteSpace:"nowrap"}},"Déconnexion"),
  );

  return React.createElement("div",{style:{minHeight:"100vh",background:"#F5F0E8"}},
    topBar,
    error && React.createElement("div",{style:{background:"#FFF0EE",border:"1px solid #F0C0BB",color:"#C06060",padding:"10px 20px",fontSize:13,display:"flex",justifyContent:"space-between",alignItems:"center"}},
      error,
      React.createElement("button",{onClick:()=>setError(null),style:{background:"transparent",border:"none",cursor:"pointer",color:"#C06060",fontSize:16}},"✕"),
    ),
    React.createElement("div",{style:{padding:"20px 16px 60px",maxWidth:560,margin:"0 auto"}},
      active
        ? React.createElement(WheelEditor,{sheet:active,onChange:fn=>update(active.id,fn)})
        : sheets.length===0
          ? React.createElement("div",{style:{textAlign:"center",padding:"60px 20px",color:"#B0A090",fontStyle:"italic"}},
              React.createElement("div",{style:{fontSize:48,marginBottom:14,opacity:0.35}},"◎"),
              React.createElement("div",{style:{fontSize:15}},"Aucune feuille pour l'instant."),
              React.createElement("div",{style:{fontSize:13,marginTop:6}},"Crée une nouvelle grille ou importe un fichier .json."),
            )
          : React.createElement("div",{style:{display:"flex",flexDirection:"column",gap:10}},
              React.createElement("div",{style:{display:"flex",gap:6,marginBottom:4}},
                ...[
                  {id:'en_cours', label:'En cours'},
                  {id:'boucle',   label:'Bouclé'},
                  {id:'insere',   label:'Inséré'},
                ].map(f=>React.createElement("button",{
                  key:f.id,
                  onClick:()=>setFilter(f.id),
                  style:{padding:"6px 14px",fontSize:11,borderRadius:20,border:`1.5px solid ${filter===f.id?"#2C1810":"#D0C5B5"}`,background:filter===f.id?"#2C1810":"white",color:filter===f.id?"#FDFAF6":"#5A4A3A",cursor:"pointer",fontFamily:"Georgia,serif",letterSpacing:"0.03em"},
                },f.label)),
              ),
              React.createElement("div",{style:{fontSize:11,color:"#8B7355",letterSpacing:"0.1em",textTransform:"uppercase",marginBottom:4}},`${filteredSheets.length} feuille${filteredSheets.length>1?"s":""} enregistrée${filteredSheets.length>1?"s":""}`),
              ...filteredSheets.map(s=>React.createElement(SheetCard,{key:s.id,sheet:s,onOpen:()=>setActiveId(s.id),onDelete:()=>remove(s.id),onExport:()=>exportSheet(s),onInsert:()=>insertSheet(s)})),
              filteredSheets.length===0 && React.createElement("div",{style:{textAlign:"center",padding:"30px 20px",color:"#B0A090",fontStyle:"italic",fontSize:13,background:"white",borderRadius:12,border:"1px solid #E8E0D4"}},"Aucune feuille dans cette catégorie."),
            ),
    ),
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
</script>
</body>
</html>
